<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apresentação - Fundo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f8fafc; /* Fundo claro */
      position: relative;
    }

    /* Imagem de circuito com 10% de opacidade */
    .bg-tecnologia {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.10;
      pointer-events: none;
    }

    /* Botão com o Logo no canto inferior direito */
    .btn-voltar-home {
      position: absolute;
      bottom: 24px;
      right: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 16px;
      padding: 10px 14px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.12);
      transition: all 0.25s ease;
      z-index: 10;
    }

    .btn-voltar-home:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 28px -4px rgba(249, 115, 22, 0.25);
      border-color: #f97316;
    }

    .btn-voltar-home img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Imagem de Fundo (10% de opacidade) -->
  <img src="chip-bg.jpg" alt="Circuito de Tecnologia" class="bg-tecnologia" />

  <!-- Logo no canto inferior direito que volta ao index -->
  <a href="index.html" class="btn-voltar-home" title="Voltar ao início">
    <img src="logo.png" alt="EvenTuca Logo" />
  </a>

</body>
</html>
